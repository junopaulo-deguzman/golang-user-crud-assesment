openapi: 3.0.3

info:
  title: User CRUD API
  version: 1.0.0
  description: A REST API for creating, retrieving, updating, and deleting users.

servers:
  - url: http://localhost:8080
    description: Local development server

security:
  - basicAuth: []

paths:
  /users:
    post:
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
            example:
              username: user
              email: user@example.com
              age: 30
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                username: user
                email: user@example.com
                age: 30
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      summary: Get a user by ID
      operationId: getUserByID
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                username: user
                email: user@example.com
                age: 30
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update a user by ID
      operationId: updateUserByID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
            example:
              username: user-updated
              email: user.updated@example.com
              age: 31
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                username: user-updated
                email: user.updated@example.com
                age: 31
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      summary: Partially update a user by ID
      operationId: patchUserByID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
            example:
              age: 32
      responses:
        '200':
          description: User patched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                username: user-patched
                email: user.patched@example.com
                age: 32
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete a user by ID
      operationId: deleteUserByID
      responses:
        '204':
          description: User deleted successfully; the response has no body
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Use the configured BASIC_AUTH_USERNAME and BASIC_AUTH_PASSWORD credentials.

  parameters:
    UserID:
      name: id
      in: path
      required: true
      description: Positive numeric ID of the user.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  schemas:
    UserInput:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - age
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
          example: user
        email:
          type: string
          format: email
          maxLength: 254
          example: user@example.com
        age:
          type: integer
          minimum: 1
          example: 30

    User:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - email
        - age
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        username:
          type: string
          example: user
        email:
          type: string
          format: email
          example: user@example.com
        age:
          type: integer
          minimum: 1
          example: 30

    UserPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one property is required. Omitted properties remain unchanged.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
          example: user-patched
        email:
          type: string
          format: email
          maxLength: 254
          example: user.patched@example.com
        age:
          type: integer
          minimum: 1
          example: 32

    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          example: User not found

  responses:
    BadRequest:
      description: The request body or user ID is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Invalid request payload

    Unauthorized:
      description: Basic authentication credentials are missing or invalid.
      headers:
        WWW-Authenticate:
          description: Authentication challenge using the Basic scheme.
          schema:
            type: string
            example: Basic realm="Restricted"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized

    NotFound:
      description: No user exists with the supplied ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: User not found

    Conflict:
      description: The username or email is already in use.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Username or email already exists

    InternalServerError:
      description: An unexpected server or database error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Failed to process the request
